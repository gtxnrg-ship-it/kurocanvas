name: Project checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pin npm version used by reproducible CI
        run: npm install --global npm@11.6.0

      - name: Install exactly from committed lockfile
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Required acceptance sequence (typecheck, tests, production build)
        run: npm run typecheck && npm test && npm run build
