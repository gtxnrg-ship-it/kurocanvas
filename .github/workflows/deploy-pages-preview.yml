name: Publish development preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kurocanvas-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin npm version with the known peer-graph fix
        run: npm install --global npm@11.6.0
      - name: Install exactly from committed lockfile
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build website
        run: npm run build -- --mode pages
      # Pages must be enabled once by a repository maintainer in Settings → Pages.
      # The GitHub Actions integration does not have permission to create the Pages site.
      - name: Configure GitHub Pages when the repository site is enabled
        id: pages-configure
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Upload the Pages deployment artifact
        if: steps.pages-configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Keep a downloadable web preview when Pages is not enabled
        if: steps.pages-configure.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kurocanvas-web-preview-run-${{ github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 14
      - name: Report the Pages setting requirement
        if: steps.pages-configure.outcome != 'success'
        run: echo "GitHub Pages is not enabled for this repository. The verified website build is available as this run's kurocanvas-web-preview artifact."
      - name: Deploy preview
        id: deployment
        if: steps.pages-configure.outcome == 'success'
        uses: actions/deploy-pages@v4
