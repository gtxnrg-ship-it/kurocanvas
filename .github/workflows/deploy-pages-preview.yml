name: Publish development preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kurocanvas-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin npm version with the known peer-graph fix
        run: npm install --global npm@11.6.0
      - name: Install exactly from committed lockfile
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build website
        run: npm run build -- --mode pages
      # Pages must be enabled once by a repository maintainer in Settings → Pages.
      # The GitHub Actions integration does not have permission to create the Pages site.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
