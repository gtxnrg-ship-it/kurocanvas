name: Kuro Canvas checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin npm version with the known peer-graph fix
        run: npm install --global npm@11.6.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Dependency security audit (diagnostic)
        shell: bash
        run: |
          npm audit --json > /tmp/kuro-npm-audit.json || true
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("/tmp/kuro-npm-audit.json", "utf8"));
            const vulns = report.vulnerabilities || {};
            const items = Object.entries(vulns).map(([name, value]) => ({
              name, severity: value.severity, range: value.range,
              direct: value.isDirect, fixAvailable: value.fixAvailable,
              via: (value.via || []).map(issue => typeof issue === "string" ? issue : issue.title || issue.name || issue.url)
            }));
            console.log(JSON.stringify({
              metadata: report.metadata?.vulnerabilities,
              vulnerabilities: items
            }, null, 2));
          '
      - name: Required acceptance sequence (typecheck, tests, production build)
        run: npm run typecheck && npm test && npm run build
      - name: Upload testable web build
        uses: actions/upload-artifact@v4
        with:
          name: kuro-canvas-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
